version: '3.8'

services:
  fiscal-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiscal_service
    ports:
      - "${FISCAL_SERVICE_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:8080
      - ApiKey__Value=${FISCAL_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
